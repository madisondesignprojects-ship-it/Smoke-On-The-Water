<!-- LOYALTY / NEWSLETTER -->
<section class="band">
  <div class="wrap band__in">
    <div>
      <h2>Never miss a deal.</h2>
      <p>Join the list for sales, restocks and in-store events, and ask at the counter about our loyalty program.</p>
    </div>
    <form class="signup" onsubmit="event.preventDefault();this.querySelector('.signup__ok').hidden=false;this.reset();">
      <label for="email" class="sr">Email address</label>
      <input id="email" type="email" required placeholder="you@email.com" autocomplete="email">
      <button class="btn btn--dark" type="submit">Sign me up</button>
      <p class="signup__ok" role="status" hidden>Thanks for subscribing!</p>
    </form>
  </div>
</section>
